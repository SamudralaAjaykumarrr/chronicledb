name: Bug report
description: Something is broken, but you do not suspect a correctness/data-safety issue (see the "Correctness / safety bug" template for that).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. If you suspect data loss, a durability violation, or an incorrect commit/read result, please use the **Correctness / safety bug** template instead — it captures the extra evidence that kind of issue needs.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `chronicledb-node -version`, or the git commit hash you built from.
      placeholder: "chronicledb-node v0.1.0 (commit abc1234..., built 2026-01-01T00:00:00Z)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands/flags/SQL statements, in order. Include a minimal example if possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/arch, Go version (`go version`), standalone or replicated deployment.
