name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history (not the default shallow, single-commit
          # checkout) is required: the compatibility tests under
          # cmd/chronicledb-node build real "old" chronicledb-node
          # binaries from previously-released tags via a temporary `git
          # worktree add`, which needs those historical commits to
          # actually be present in this checkout's object database.
          # More than one tag is used, and the set grows with each
          # release that adds a compatibility boundary:
          #   - v0.3.0 — mixed_version_test.go's pre-v0.4.0 baseline,
          #     for the generation/rollback boundary v0.4.0 introduced.
          #   - v0.4.0 — mixed_version_membership_test.go and
          #     membership_snapshot_backup_test.go, for v0.5.0's
          #     FormatVersion 1 snapshot, real old-binary backup, and
          #     mixed-binary dynamic-membership proofs.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # ChronicleDB has zero external Go module dependencies (no
          # go.sum, see docs/dependencies.md) — module caching keyed on
          # go.sum would have nothing to cache, so disable it explicitly
          # rather than let it warn about a missing go.sum every run.
          cache: false
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (windows cross-compile check)
        # docs/v0.6.0-plan.md §6.2/§33 slice 3: internal/storage's
        # DiskUsage has a real (unix) implementation and an
        # ErrDiskUsageUnsupported stub (!unix) — this runner is
        # Linux-only (docs/support-matrix.md), so the stub's own build
        # tag excludes it from every other step above. This is the
        # stub's continuous "tested by build tag" evidence: it must at
        # least type-check for a non-unix target on every push, even
        # though its test cannot actually run here.
        run: GOOS=windows go vet ./internal/storage/...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: chaos suites (deterministic + real-disk)
        # Phase 7's seeded, reproducible randomized chaos suites — a
        # fast, CI-sized seed count on every push (already included in
        # the plain "go test ./..." above; this step just isolates them
        # for a clear pass/fail signal and higher log verbosity). See
        # docs/testing-strategy.md §6.5 for the CHRONICLEDB_CHAOS_SEEDS
        # environment variable used to run a much larger seed count
        # locally/nightly, e.g.:
        #   CHRONICLEDB_CHAOS_SEEDS=5000 go test ./internal/fault/... -run TestChaos -timeout 300s
        run: |
          go test ./internal/fault/... -run TestChaos -v -timeout 120s
          go test ./internal/node/... -run TestChaos -v -timeout 120s
      - name: adversarial model-based suites (Phase 10)
        # Phase 10's model-based history testing against independent
        # oracles (internal/oracle, docs/adversarial-testing.md) — a
        # fast, CI-sized seed count on every push (already included in
        # the plain "go test ./..." above; this step isolates them for
        # a clear pass/fail signal and higher log verbosity), mirroring
        # the Phase 7 "chaos suites" step above. See
        # docs/adversarial-testing.md's "Reproducing a run" section for
        # the CHRONICLEDB_ADVERSARIAL_SEEDS environment variable used to
        # run a much larger seed count locally/nightly, e.g.:
        #   CHRONICLEDB_ADVERSARIAL_SEEDS=2000 go test ./internal/sql/... -run TestModel -timeout 300s
        run: |
          go test ./internal/node/... -run 'TestModel_|TestCrossLayer_' -v -timeout 120s
          go test ./internal/sql/... -run TestModel_ -v -timeout 60s
          go test ./internal/txn/... -run 'TestSIHistory|TestModel_' -v -timeout 60s
          go test ./internal/fault/... -run 'TestChaos_StaleAppendEntriesAfterSnapshotInstall|TestChaos_RepeatedCompactRestartCycle|TestChaos_LeaderChangeImmediatelyAfterSnapshot' -v -timeout 60s
          go test ./internal/raft/... -run TestStaleAppendEntries -v -timeout 30s
          go test ./internal/wal/... -run TestRepeatedSnapshotCompactRestartCycle -v -timeout 30s
      - name: real multi-process integration + real-process chaos (cmd/chronicledb-node)
        # Real OS processes, real TCP sockets, real disk, a real SIGKILL,
        # leader election/failover, and a RequestID retry — the Phase 5
        # "real multi-process/real-disk proof" evidence
        # docs/testing-strategy.md and docs/roadmap.md require in
        # addition to the deterministic simulator above — plus Phase
        # 7's real-process chaos suite (chaos_test.go: a follower
        # SIGKILLed mid-replication, repeated SIGKILL attempts around a
        # real snapshot install, a lost-response-then-retry sequence,
        # and a genuine network partition/heal via the /fault
        # control-plane endpoint). Fast and fully localhost-contained,
        # so it runs on every push rather than being gated to a
        # manual/nightly job; see cmd/chronicledb-node/main_test.go's
        # and chaos_test.go's doc comments for the explicit standalone
        # invocation.
        run: go test -tags=integration ./cmd/chronicledb-node/... -v -timeout 180s
      - name: fuzz smoke (wal)
        run: go test ./internal/wal/... -fuzz FuzzDecodeFrameBytes -fuzztime 15s
      - name: fuzz smoke (fsm)
        run: go test ./internal/fsm/... -fuzz FuzzDecodeCommitTxn -fuzztime 15s
      - name: fuzz smoke (raft append-entries reconciliation)
        run: go test ./internal/raft/... -fuzz FuzzAppendEntriesReconciliation -fuzztime 15s
      - name: fuzz smoke (raft request-vote handling)
        run: go test ./internal/raft/... -fuzz FuzzRequestVoteHandling -fuzztime 15s
      - name: fuzz smoke (raft membership config-change decode)
        run: go test ./internal/raft/... -fuzz FuzzDecodeEntryConfig -fuzztime 15s
      - name: fuzz smoke (node typed entry payload decode)
        run: go test ./internal/node/... -fuzz FuzzDecodeEntryPayload -fuzztime 15s
      - name: fuzz smoke (transport frame decode)
        run: go test ./internal/transport/... -fuzz FuzzReadFrame -fuzztime 15s
      - name: fuzz smoke (sql parser)
        run: go test ./internal/sql/... -fuzz FuzzParse -fuzztime 15s
      - name: fuzz smoke (sql schema/row decode)
        run: |
          go test ./internal/sql/... -fuzz FuzzDecodeSchema -fuzztime 15s
          go test ./internal/sql/... -fuzz FuzzDecodeRow -fuzztime 15s
      - name: fuzz smoke (snapshot decode)
        run: go test ./internal/snapshot/... -fuzz FuzzDecode -fuzztime 15s
      - name: fuzz smoke (audit log frame decode)
        run: go test ./internal/audit/... -fuzz FuzzDecodeFrame -fuzztime 15s
      - name: benchmark compile + single-iteration smoke
        # Phase 9 (docs/testing-strategy.md §9.3): every benchmark added
        # this phase must keep compiling and its own internal
        # correctness checks (docs/roadmap.md §Benchmark correctness)
        # must keep passing, without paying for a full,
        # statistically-meaningful benchmark run on every push. A full
        # representative run (the numbers actually published in
        # docs/benchmarks.md) is a documented manual/local command —
        # see docs/benchmarks.md §5.
        run: go test ./... -run '^$' -bench . -benchtime=1x -timeout 180s
