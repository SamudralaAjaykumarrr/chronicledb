name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: real multi-process integration (cmd/chronicledb-node)
        # Real OS processes, real TCP sockets, real disk, a real SIGKILL,
        # leader election/failover, and a RequestID retry — the Phase 5
        # "real multi-process/real-disk proof" evidence
        # docs/testing-strategy.md and docs/roadmap.md require in
        # addition to the deterministic simulator above. Fast and fully
        # localhost-contained, so it runs on every push rather than
        # being gated to a manual/nightly job; see
        # cmd/chronicledb-node/main_test.go's doc comment for the
        # explicit standalone invocation.
        run: go test -tags=integration ./cmd/chronicledb-node/... -v -timeout 120s
      - name: fuzz smoke (wal)
        run: go test ./internal/wal/... -fuzz FuzzDecodeFrameBytes -fuzztime 15s
      - name: fuzz smoke (fsm)
        run: go test ./internal/fsm/... -fuzz FuzzDecodeCommitTxn -fuzztime 15s
      - name: fuzz smoke (raft append-entries reconciliation)
        run: go test ./internal/raft/... -fuzz FuzzAppendEntriesReconciliation -fuzztime 15s
      - name: fuzz smoke (raft request-vote handling)
        run: go test ./internal/raft/... -fuzz FuzzRequestVoteHandling -fuzztime 15s
      - name: fuzz smoke (transport frame decode)
        run: go test ./internal/transport/... -fuzz FuzzReadFrame -fuzztime 15s
